name: sdd-with-feedback-loop
version: 1
description: >
  Spec-driven development with full feedback loop:
  proposal → design → specs → tasks → apply → archive.

artifacts:
  - id: proposal
    generates: proposal.md
    description: Change proposal capturing why, problem space, scope, and risks
    template: proposal.md
    instruction: |
      Document: why needed, problem space, scope (in/out), risks, open questions, non-goals.
      Add change-control note: if scope changes, artifacts must be updated before implementing.
      Assign any ticket used for this proposal or exploration to the current user.
    requires: []

  - id: design
    generates: design.md
    description: Technical design mapping proposal elements to implementation decisions
    template: design.md
    instruction: |
      Document technical design mapping proposal elements to decisions.
      Document functional/non-functional requirements mapped to specs. Include testability,
      risks, rollback plan, and operational blocking policy for CI/review failures.
    requires:
      - proposal

  - id: specs
    generates: specs/**/*.md
    description: Capability specifications with behavior-driven acceptance criteria
    template: spec.md
    instruction: |
      Document capabilities affected. Express acceptance criteria as behavior scenarios (Given/When/Then).
      Include ADDED, MODIFIED, REMOVED sections. Include non-functional criteria if affected.
      Ensure explicit traceability from requirements to scenarios.
    requires:
      - proposal
      - design

  - id: tasks
    generates: tasks.md
    description: Implementation task checklist with Preparation through Post-Merge steps
    template: tasks.md
    instruction: |
      Create task list with sections: Preparation, Execution, Pre-Commit Code Review,
      Validation, PR and Merge, and Post-Merge. Follow strict BDD/TDD.
      Include ownership metadata and a blocking resolution flow.
      Require the `openspec-review-code` sub-agent to be run before every commit, and require the primary agent to automatically address all findings from the sub-agent before committing.
      Ensure PRs are set to auto-merge when created. All paths must be relative to project root.
    requires:
      - specs

  - id: tests
    generates: tests.md
    description: Test cases following a strict TDD workflow
    template: tests.md
    instruction: |
      Create test cases for all tasks following strict TDD (fail, pass, refactor).
      Map each case to a task in tasks.md and an acceptance scenario in specs.
    requires:
      - tasks

apply:
  requires: [tasks, tests]
  tracks: tasks.md
