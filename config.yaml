schema: sdd-with-feedback-loop

context: |
  Use default OpenSpec sdd-with-feedback-loop flow (proposal -> design -> specs -> tasks -> apply -> archive).
  Keep artifacts concise and implementation-ready.
  Preserve default OpenSpec artifact lifecycle and dependency ordering.
  All file and folder references must be project-root-relative paths (for example, openspec/changes/my-change/proposal.md).

rules:
  proposal:
    - "Iterate on proposal quality before finalizing; explicitly call out gaps, assumptions, constraints, and edge cases."
    - 'Include an "Open Questions" section with concrete questions for the requester. If no unresolved ambiguity exists, include a statement confirming this.'
    - "Fully define problem space boundaries: in-scope, out-of-scope, impacted capabilities, and risks."
    - 'Required sections: "GitHub Issues", "Why", "Problem Space", "Scope", "What Changes", "Risks", "Open Questions", "Non-Goals".'
    - "Include explicit change-control note: if scope changes after approval, proposal/design/specs/tasks must be updated before apply."
    - "Proposal must be reviewed and explicitly approved by a human before design, specs, tasks, or apply proceed."

  design:
    - "Every major proposal element must map to a corresponding design decision."
    - "Document functional and non-functional requirements and ensure they map to acceptance criteria in specs."
    - "For each requirement, include testability notes and expected validation approach."
    - 'Required sections: "Context", "Goals / Non-Goals", "Decisions", "Risks / Trade-offs", "Rollback / Mitigation", "Open Questions".'
    - "Include explicit mapping table or bullet mapping from proposal elements to design decisions."
    - "Include operational blocking policy: what to do if CI/review/security checks remain blocked."

  specs:
    - "Acceptance criteria must be expressed as behavior scenarios (Given/When/Then or equivalent WHEN/THEN format)."
    - "Ensure each scenario is measurable and unambiguous."
    - "Include non-functional acceptance criteria when performance, security, reliability, or operability are affected."
    - 'Required sections per capability: "ADDED/MODIFIED/REMOVED Requirements" with at least one scenario each.'
    - "Include explicit traceability from requirements to acceptance scenarios."
    - "NFAC scenarios MUST NOT duplicate scenarios already present in the functional requirements sections. If a functional scenario already covers a given access-control, error-handling, or behavioral case, the NFAC Security section MUST cross-reference that functional scenario (e.g., 'See functional scenario: <name>') instead of repeating it. Only add a distinct NFAC scenario when it expresses a genuinely new non-functional property (latency budget, audit log, token not leaked in error body, etc.)."
    - "Delta spec files inside openspec/changes/<name>/specs/<capability>/ MUST be named spec.md (not named after the capability). The directory name carries the capability identity; the file is always spec.md."
    - "When a delta spec is promoted to openspec/specs/<capability>/spec.md during archive, all relative references to design.md and tasks.md MUST be updated to point to their archived locations: ../../changes/archive/YYYY-MM-DD-<name>/design.md and ../../changes/archive/YYYY-MM-DD-<name>/tasks.md."

  tasks:
    - "When initializing a change manually (without the openspec-propose skill), run npm run opsx:init-change -- <change-name> [capability-name] from project root. When using the propose skill, initialization is handled automatically."
    - "Keep default implementation ordering from schema dependencies; do not reorder artifacts outside default flow."
    - "Step 1 of Execution must always be: checkout the default branch (main or master) and pull with fast-forward only."
    - "Step 2 of Execution must always be: create the working branch from the default branch, then immediately push it to remote with `git push -u origin <feature-branch-name>` — the branch must exist on remote before any implementation work begins."
    - "After creating and pushing the working branch, if the change is issue-driven (a GitHub issue number is recorded in the proposal): (a) run `gh issue edit #N --add-label \"in-progress\"`; (b) discover the GitHub Project linked to the repo via `gh project list --owner <owner> --format json`, resolve the status field option semantically matching \"In Progress\" using `gh project field-list <project-number> --owner <owner> --format json`, and move the item via `gh project item-edit`. If no project item is found, log a warning and continue. If the `gh` token lacks the `project` scope, surface a message instructing the user to run `gh auth refresh -s project` and skip the project-item update (issue label update still proceeds). If the change is not issue-driven, skip all hooks silently."
    - "Before every commit, the agent must spawn a sub-agent to run the openspec-review-code skill and automatically apply all clearly-correct findings to the code — without stopping, without presenting the finding list to the user, and without asking for confirmation. Apply fixes, re-run tests, then commit. This step is mandatory and must never be skipped."
    - "After all local validation passes and all tasks are marked complete, the agent must commit all changes to the working branch, push to remote, and open a PR from the working branch to the default branch. The PR body must include `Closes #N` for each linked issue number if the change is issue-driven (unconditionally, not as an optional step)."
    - "When the PR is opened and the change is issue-driven: run `gh issue edit #N --add-label \"in-review\" --remove-label \"in-progress\"`, then move the project item to the status column semantically matching \"In Review\" via `gh project item-edit` (same discovery pattern as branch creation; warn and skip if not found)."
    - "After opening a PR, wait 60 seconds for CI to start, then spawn a sub-agent to run `pr-review-toolkit:review-pr`. Address all findings, commit, push, and re-run the review until zero findings remain. If findings persist after three or more review-fix-push iterations with no progress, report the stall to the user with the remaining findings listed and wait for human guidance. Only after the review gate passes (zero findings), enable auto-merge via `gh pr merge <PR-URL> --auto --merge`. The agent must then actively monitor for review comments and CI check results autonomously — never wait for a human to report new comments or that the PR has merged. For comments: address each one, commit fixes, push, and repeat. For CI failures: diagnose, fix, commit, push, and repeat. After each iteration, poll `gh pr view --json state`; when state is MERGED proceed to post-merge steps, or if CLOSED exit and notify the user."
    - "Never force-merge; enable auto-merge only after the pr-review-toolkit:review-pr gate passes and let GitHub merge when all conditions are met."
    - "The generated tasks.md must include a Preflight section between Preparation and Execution that verifies `pr-review-toolkit:review-pr` is available in the current environment. If the skill is not available, the agent must halt, inform the user that the plugin is required, provide installation guidance, and not proceed until the user confirms it is installed."
    - "Post-merge steps must be performed in order: (1) checkout the default branch and pull, (2) verify merged changes appear on the default branch, (3) mark all tasks complete, (4) sync approved spec deltas to openspec/specs/, (5) archive the change directory as a single atomic commit that includes both the copy to archive/ and the deletion of the original location — never split this into two commits, (6) push the archive commit to the default branch."
    - "Include completion checklist items for: docs updates, archive step, syncing approved spec deltas back to openspec/specs before or during archive workflow, and pruning merged local branches after archive."
    - "Prefer small, testable tasks with explicit verification commands."
    - 'Required sections: "Preparation", "Preflight", "Execution", "Pre-Commit Code Review", "Validation", "PR and Merge", "Post-Merge".'
    - "Include ownership metadata where available: implementer, reviewer, and approval expectation."
    - "Define blocking criteria and resolution flow for CI failures, unresolved review comments, and security findings."
    - "All file/folder references in tasks content must be relative to project root; never use absolute paths."
