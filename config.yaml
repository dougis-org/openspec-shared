schema: sdd-with-feedback-loop

context: |
  Flow: proposal -> design -> specs -> tasks -> tests -> apply -> archive. Keep artifacts concise and implementation-ready.
  All file/folder references are project-root-relative (e.g. openspec/changes/my-change/proposal.md); never absolute.
  Rules and context constrain the author; never copy them into artifacts.
  Process details (branching, PR loop, review, archive) live in skills/openspec-apply-change and skills/openspec-archive-change. Reference them; do not restate them in artifacts.

rules:
  proposal:
    - 'Required sections: "GitHub Issues", "Why", "Problem Space", "Scope", "What Changes", "Risks", "Open Questions", "Non-Goals". Call out gaps, assumptions, constraints, edge cases.'
    - 'Open Questions must be concrete; if none, state that no unresolved ambiguity exists.'
    - "Include change-control note: if scope changes after approval, proposal/design/specs/tasks must be updated before apply."
    - "A human must explicitly approve the proposal before design, specs, tasks, or apply proceed."

  design:
    - 'Required sections: "Context", "Goals / Non-Goals", "Decisions", "Risks / Trade-offs", "Rollback / Mitigation", "Operational Blocking Policy", "Open Questions".'
    - "Each decision names the proposal element it addresses, its functional/non-functional requirements, and testability notes. Every major proposal element must map to a decision."
    - "Blocking policy covers CI (including quality gates and coverage), review, and security failures."

  specs:
    - "Acceptance criteria are measurable Given/When/Then (or WHEN/THEN) scenarios; include non-functional criteria when performance, security, reliability, or operability are affected."
    - 'Per capability: ADDED/MODIFIED/REMOVED requirements, each with at least one scenario.'
    - "The Traceability block is the single home for requirement -> scenario -> task traceability."

  tasks:
    - "When initializing manually (without the propose skill), run npm run opsx:init-change -- <change-name> [capability-name] from project root."
    - "Sections: Preparation, Execution, Pre-Commit Code Review, Validation, PR and Merge, Post-Merge. Keep artifact order as defined by the schema."
    - "Preparation: checkout default branch, pull --ff-only, create the working branch and push it to remote before any implementation."
    - "Tasks are small and testable, each naming its tests.md cases and a verification command. Strict BDD/TDD: failing test first."
    - "Run the openspec-review-code sub-agent before every commit and fix all findings."
    - "Definition of done for apply: the PR is merged with every required CI check passing, including whatever quality gates the repo defines (tests, build, lint/static analysis, security scans, coverage). Use the repo's own docs and CI config for commands and thresholds; never name tools or numbers here. Never waive, lower, skip, or disable a check to get green; if a gate looks wrong, pause and ask the user."
    - "PR and Merge: open PR with `Closes #N` for each proposal issue, enable auto-merge immediately (never --admin), then follow the apply skill's PR loop until merged."
    - "Post-Merge: run /opsx:archive. The change is fully done only after archive and local cleanup finish."
    - "Include ownership metadata (implementer, reviewer, approvals) and blocking flow for CI failures, review comments, and security findings."

  tests:
    - "Each case maps to a task in tasks.md and a scenario in the specs."
